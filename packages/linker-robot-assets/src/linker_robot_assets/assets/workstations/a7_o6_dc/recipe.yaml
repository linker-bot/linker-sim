schema_version: 1
name: a7_o6_dc
description: >
  Bimanual A7 torso + two 7-DOF A7 arms + two Linkerhand O6 hands, all
  welded into a single articulation via the composer. Arm kinematics
  come from the SDK per-side URDFs (a7__left/right.urdf); inertials and
  meshes come from the 数采方案1.SLDASM data-collection source, split into
  torso + per-side arm components and renamed L1..L7 / R1..R7. Roles
  arm_left / arm_right / hand_left / hand_right are addressable through
  Robot.joint_ids_of(role); the torso is a fixed base welded to world at
  z=1.2m.

components:
  base:
    component: bases/a7_torso
    variant: default
  arm_left:
    component: arms/a7
    variant: left
  arm_right:
    component: arms/a7
    variant: right
  hand_left:
    component: hands/linkerhand_o6
    variant: left
  hand_right:
    component: hands/linkerhand_o6
    variant: right

freeze_base: base

# Arm mount offsets are identity: the torso's mount-pad links already sit
# at the source joint_l1 / joint_r1 origins. Hand wrist rpy is a7_lite's
# quarter-turn (palms inward). Hand wrist xyz is the hardware EEF TCP:
# joint_l8 / joint_r8 origin (-0.0225, 0, -0.0705) relative to Link_{l,r}7
# (= our tool0), from the A7_arm_and_torso URDF (TCP added at the physical
# hand attachment point by the hardware team; rpy is 0 there, so
# orientation stays a7_lite's palm-facing quarter-turn).
mounts:
  - child: arm_left:base_mount
    parent: base:arm_left_mount
    xyz: [0.0, 0.0, 0.0]
    rpy: [0.0, 0.0, 0.0]
  - child: arm_right:base_mount
    parent: base:arm_right_mount
    xyz: [0.0, 0.0, 0.0]
    rpy: [0.0, 0.0, 0.0]
  - child: hand_left:wrist_mount
    parent: arm_left:tool0
    xyz: [-0.0225, 0.0, -0.0705]
    rpy: [3.1416, 0.0, -1.5708]
  - child: hand_right:wrist_mount
    parent: arm_right:tool0
    xyz: [-0.0225, 0.0, -0.0705]
    rpy: [3.1416, 0.0, 1.5708]
